[package]
name = "davinci-core"
version = "1.0.0"
edition = "2021"

[workspace]
members = [".", "crates/davinci-core-pkg"]

[features]
# Stage 2 of ps5/build.sh: embeds stage 1 (env DAVINCI_SELF_ELF) to save it as the tile's copy.
self-copy = []
unified-stack = []

[dependencies]
davinci-core-pkg = { path = "crates/davinci-core-pkg" }
libc = "0.2.187"
serde_json = "1"

# Block decoding is hot during cache builds.
[profile.release.package.davinci-core-pkg]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
